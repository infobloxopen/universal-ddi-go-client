openapi: 3.0.1
info:
  contact:
    name: CDC API Service
  description: "Infoblox Data Connector is a utility that collects DNS query and response\
    \ data as well as security logs from specified sources. It works with various\
    \ components in your hybrid cloud environment to deliver source data to your configured\
    \ destinations. Data Connector transfers the collected data to defined destinations,\
    \ such as BloxOne Threat Defense Cloud, the Infoblox NIOS reporting server, and\
    \ the generic syslog with the CEF or LEEF message format. Data Connector supports\
    \ integrations by using the Splunk forwarder and generic syslog formats."
  title: Data Connector Service
  version: v1
servers:
- url: /api/cdc-flow/
security:
- ApiKeyAuth: []
