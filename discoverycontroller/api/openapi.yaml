          type: string
        exclusion_ip_address_range:
          description: Represents the ipaddress or range that has to be excluded from
            the discovery scan.
          type: string
        exclusion_mode:
          title: |-
            Internal flag to represent whether to include entire network for scan or to exclude a certain subset of network from discovery scan.
            Valid values are:
            *_include_* : Includes the network/network range specified in ip_address_range field for the discovery scan.
            *_exclude_* : Excludes the network/network range specified in the exlusion_ip_address_range field from the discovery scan.
            *_ignore_* : -- Not used currently --
          type: string
        ip_address_range:
          description: Represents the network to be scanned in the format of cidr/mask
            or range of IPs.
          type: string
        ip_space_action:
          description: |-
            The inheritance setting for IP Space
            Valid values are:
            * _inherit_: Use the inherited value from parent IPSpace
            * _override_: Use the value set in the object.

            Defaults to _inherit_.
          type: string
        ping_sweep:
          format: boolean
          title: Enables full ping sweep of the network
          type: boolean
      type: object
    controllerScheduleTime:
      description: |-
        Time Schedule Item. Message holds a recurring time point or period (if duration > 0),
        The way of its definition is dictated by XML types ScheduleWeekly, ScheduleMonthly,
        ScheduleDaily, ScheduleHourly, and ScheduleOnce of the NI configuration schema,
        which are used to schedule pollings, discovery blackout or port control blackout periods in NI.
      example:
        duration: duration
        dom: 0
        time: time
        type: type
        dow: dow
        every: 6
        enabled: true
      properties:
        dom:
          format: int64
          title: day of month for "monthly" type
          type: integer
        dow:
          title: "days of week for \"weekly\" type, an ascii string containing one\
            \ or more digits 0..6"
          type: string
        duration:
          title: "duration of the period (for blackouts), 0 is acceptable meaning\
            \ just time point is defined"
          type: string
        enabled:
          format: boolean
          type: boolean
        every:
          format: int64
          title: "schedule every x months for \"monthly\" type, 1 means every month"
          type: integer
        time:
          title: Only significant Date and Time components are used depending on the
            type
          type: string
        type:
          type: string
      type: object
    controllerService:
      example:
        ophid: ophid
        service_name: service_name
        service_id: service_id
      properties:
        ophid:
          description: Required. On-Prem Host ID on which the job is to run.
          type: string
        service_id:
          description: Required. Unique Identifier of the discovery service associated
            with this job config.
          type: string
        service_name:
          description: Read-only. Name of the discovery service.
          readOnly: true
          type: string
      type: object
