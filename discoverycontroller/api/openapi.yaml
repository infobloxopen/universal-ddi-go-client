        enable:
          description: |-
            Flag to indicate if this Configuration is enabled.
            Defaults to _true_.
          format: boolean
          type: boolean
        id:
          description: The resource identifier.
          readOnly: true
          type: string
        name:
          description: Required. Name of the configuration.
          type: string
        source_id:
          description: |-
            Source id is the unique identifier of the source.
            Example: in case of NGC, it would be NIOS grid id.
          type: string
        source_name:
          description: |-
            In case of NGC, it would be the grid name.
            The grid name can have conflicts for multiple grids in same account. So grid-name should be suffixed with last 4 chars of grid_id.
            Example:
            Infoblox-c35f
            This can be done only if name is default (Infoblox)
            In case of Active Discovery, it would be NMAP.
          type: string
        source_type:
          description: |-
            Required. Defines the source type for the configuration.
            Valid values are:
             * _ngc_: NIOS Grid Connector source type.
             * _active_: Active Discovery (NMAP) source type. **Deprecated** - retained for backwards compatibility only. Use _ni_ for new deployments.
             * _ni_: Network Insight active discovery source type.
             * _passive_: Passive Discovery source type.
          type: string
        updated_at:
          description: "Read-only. Timestamp updated_at, equals to time when particular\
            \ object was updated, by default equals to created_at."
          format: date-time
          readOnly: true
          type: string
      type: object
