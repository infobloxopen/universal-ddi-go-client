      x-tf-datasource: discovery_ni_service_configs_v2
      x-codegen-request-body-name: body
components:
  schemas:
    apiPageInfo:
      description: |-
        PageInfo represents both server-driven and client-driven pagination response.
        Server-driven pagination is a model in which the server returns some
        amount of data along with an token indicating there is more data
        and where subsequent queries can get the next page of data.
        Client-driven pagination is a model in which rows are addressable by
        offset and page size (limit).
      example:
        offset: 0
        size: 6
        page_token: page_token
      properties:
        offset:
          description: |-
            The service may optionally include the offset of the next page of resources.
            A null value indicates no more pages.
          format: int64
          type: integer
        page_token:
          description: |-
            The service response should contain a string to indicate
            the next page of resources.
            A null value indicates no more pages.
          type: string
        size:
          description: The service may optionally include the total number of resources
            being paged.
          format: int64
          type: integer
      type: object
    controllerAdvancedSettings:
      example:
        arp_aggregate_limit: 0
        tcp_scan_technique: tcp_scan_technique
        dns_lookup_throttle: 5
        snmp_discovery_version: snmp_discovery_version
        device_expiration_days: 1
        dns_lookup_options: dns_lookup_options
        ping_timeout: 9
        ping_sweep_frequency: 7
        arp_cache_refresh_period: 6
        end_host_expiration_days: 5
        route_limit: 3
        port_scanning_enabled: true
        snmpv1_data_collection_fallback: snmpv1_data_collection_fallback
        ping_retries: 2
      properties:
        arp_aggregate_limit:
          description: Number of MAC addresses.
          format: int64
          type: integer
        arp_cache_refresh_period:
          description: ARP Cache Refresh in seconds or minutes.
          format: int64
          type: integer
        device_expiration_days:
          description: Days after which expired device data needs to be purged.
          format: int64
          type: integer
        dns_lookup_options:
          description: |-
            Specify whether to perform a DNS lookup when discovering the devices.
            Valid values are:
            * _disable_   : Turn off DNS lookup when discovering the devices.
            * _infraonly_ : Collect hostnames for the network devices using DNS lookup.
            * _all_       : Collect hostnames for network devices (switches and routers) and end host devices using DNS lookup.
          type: string
        dns_lookup_throttle:
          description: DNS Lookup Throttle. This is the value in percentage that throttles
            the traffic on the DNS server.
          format: int64
          type: integer
        end_host_expiration_days:
          description: Days after which expired assets data needs to be purged.
          format: int64
          type: integer
        ping_retries:
          description: Ping Sweep Attempts.
          format: int64
          type: integer
        ping_sweep_frequency:
          description: Ping Sweep Frequency in days or hours.
          format: int64
          type: integer
        ping_timeout:
          description: Ping Sweep timeout limit in seconds.
          format: int64
          type: integer
        port_scanning_enabled:
          description: |-
            Controls the Port Scanning for the discovered devices.

            Valid values are:
            * _enabled_: Enables the port scanning for the services specified in the Service Ports.
            * _disabled_: Disables the port scanning for the services specified in the Service Ports.
          format: boolean
          type: boolean
        route_limit:
          description: number of routes that can be configured in the discovery.
          format: int64
          type: integer
        snmp_discovery_version:
          description: |-
            Authenticate and poll using one of these versions of the SNMP protocol.
            Valid values are:
            * _snmpv1_  : Use SNMPV1 protocol.
            * _snmpv2c_ : Use SNMPV2C protocol.
          type: string
        snmpv1_data_collection_fallback:
          description: |-
            Version of SNMP protocol for credential discovery and device polling.
            Valid values are:
            * _disabled_ : Exclusively use SNMPv2c and up. Do not fallback to SNMPV1.
            * _enabled_  : Support fallback to SNMPv1, if SNMPV2C and up are not available.
          type: string
        tcp_scan_technique:
          description: |-
            Configure the TCP scan technique to be used for the discovery.

            Valid values are:
            * _syn_:     Perform scans on thousands of TCP ports per system, never completing connections across any well-known port.
                         SYN packets are sent and the poller waits for a response while continuing to scan other ports.
                         A SYN/ACK response indicates the protocol port is listening while a RST indicates it is not listening.
                         The SYN option presents less impact on the network.
            * _connect_: Perform scan on IPv6 networks. Unlike the SYN option, complete connections are attempted on the
                         scanned system and each successive TCP protocol port being scanned.
          type: string
      type: object
    controllerCLICredentials:
      description: Cli Credential Settings.
      example:
        priority: 2
        creds:
          notes: notes
          values:
          - name: name
            value: value
          - name: name
            value: value
          name: name
