openapi: 3.0.1
info:
  description: "The DDI IPAM Federation application enables a SaaS administrator to\
    \ manage multiple IPAM systems from one central control point CSP.  \n\n"
  title: IPAM Federation API
  version: v1
servers:
- url: http://csp.infoblox.com/api/ddi/v1
- url: https://csp.infoblox.com/api/ddi/v1
security:
- ApiKeyAuth: []
paths:
  /federation/aws/scope/management:
    post:
      description: Enable or disable external management of an AWS IPAM scope by updating
        the federated realm's metadata to reflect the desired management mode
      operationId: aws_scope_managementScopeManagement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/federationScopeManagementObject'
        description: Scope management configuration details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/federationScopeManagementResponse'
          description: POST operation response
        "400":
          content:
            application/json:
              schema:
                type: object
          description: "Bad Request - Invalid request parameters (e.g., malformed\
            \ scope ARN, missing required fields)"
        "401":
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized - Invalid or missing authentication token
        "404":
          content:
            application/json:
              schema:
                type: object
          description: Not Found - AWS IPAM scope not found or does not exist
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal Server Error - An unexpected error occurred while
            setting scope management
      summary: Configure management settings for AWS IPAM scopes
      tags:
      - aws_scope_management
      x-codegen-request-body-name: body
  /federation/aws/scope/token:
    post:
      description: Generate a time-limited JWT token for authenticating requests to
        the specified AWS IPAM scope
      operationId: aws_scope_tokenGenerateToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/federationManageScopeTokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/federationManageScopeTokenResponse'
          description: POST operation response
        "400":
          content:
            application/json:
              schema:
                type: object
          description: "Invalid request parameters (e.g., malformed scope ARN, invalid\
            \ expiration, missing required fields)"
        "401":
          content:
            application/json:
              schema:
                type: object
          description: "Unauthorized access (e.g., invalid account ID, disabled account)"
        "403":
          content:
            application/json:
              schema:
                type: object
          description: Access denied to the specified AWS IPAM scope
        "404":
          content:
            application/json:
              schema:
                type: object
          description: AWS IPAM scope or Infoblox account ID not found
        "500":
          content:
            application/json:
              schema:
                type: object
          description: Internal server error occurred while generating token
      summary: Generate AWS IPAM scope authentication token
      tags:
      - aws_scope_token
      x-codegen-request-body-name: body
  /federation/create_next_available_fld:
    post:
      description: |-
        Use this method to create the next "n" available __ForwardLookingDelegation__ objects considering the parameter passed.
        The response will be "n" __ForwardLookingDelegation__ objects.
        A __ForwardLookingDelegation__ object (_federation/forward_looking_delegation_) is a set of contiguous IP addresses with no gap, expressed as a CIDR block. Forward Looking Delegations may be used to allocate unique space for future resources which will ultimately hold a Delegation for the same CIDR block.
      operationId: next_available_fldCreateNextAvailableFLDBlocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/federationNextAvailableFLDRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/federationNextAvailableFLDResponse'
          description: POST operation response
      summary: Create the next available __ForwardLookingDelegation__ objects.
      tags:
      - next_available_fld
      x-codegen-request-body-name: body
