          type: string
        scope_arn:
          title: |-
            The AWS IPAM scope ARN for which the token is generated.
            Format: arn:aws:ec2:region:account-id:ipam-scope/ipam-scope-id
          type: string
        ttl:
          description: |-
            Optional token expiration duration in seconds. Defaults to 300 (5 minutes) if not specified or set to 0.
