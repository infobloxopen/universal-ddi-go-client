        in: query
        name: count
        schema:
          format: int64
          type: integer
      - description: The name to be provided.
        in: query
        name: name
        schema:
          type: string
      - description: The description for the _federation/federated_block_. May contain
          0 to 1024 characters. Can include UTF-8.
