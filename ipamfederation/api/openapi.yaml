components:
  schemas:
    apiPageInfo:
      description: |-
        PageInfo represents both server-driven and client-driven pagination response.
        Server-driven pagination is a model in which the server returns some
        amount of data along with an token indicating there is more data
        and where subsequent queries can get the next page of data.
        Client-driven pagination is a model in which rows are addressable by
        offset and page size (limit).
      example:
        offset: 0
        size: 6
        page_token: page_token
      properties:
        offset:
          description: |-
            The service may optionally include the offset of the next page of resources.
            A null value indicates no more pages.
          format: int32
          type: integer
        page_token:
          description: |-
            The service response should contain a string to indicate
            the next page of resources.
            A null value indicates no more pages.
          type: string
        size:
          description: The service may optionally include the total number of resources
            being paged.
          format: int32
          type: integer
      type: object
    federationAllocation:
      description: The __Allocation__ tracks the distribution of Federated Blocks
        within each of the supported objects.
      example:
        forward_looking_delegation: 1
        reserved: 5
        overlapping: 5
        delegated: 6
        allocated: 0
      properties:
        allocated:
          description: Percent of total space allocated.
          format: int64
          readOnly: true
          type: integer
        delegated:
          description: Percent of total space delegated.
          format: int64
          readOnly: true
          type: integer
        forward_looking_delegation:
          description: Percent of total space in forward looking delegation blocks.
          format: int64
          readOnly: true
          type: integer
        overlapping:
          description: Percent of total space in overlapping blocks.
          format: int64
          readOnly: true
          type: integer
        reserved:
          description: Percent of total space reserved.
          format: int64
          readOnly: true
          type: integer
      title: Allocation
      type: object
