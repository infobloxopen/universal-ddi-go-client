          \ data in ascending order. The suffix 'desc' sorts the data in descending\
          \ order. If no suffix is specified the data is sorted in ascending order.\n\
          \n\t\t\t\t\t\t"
        in: query
        name: _order_by
        schema:
          type: string
      - description: This parameter is used for sorting by tags.
        in: query
        name: _torder_by
        schema:
          type: string
      - description: This parameter is used for filtering by tags.
        in: query
        name: _tfilter
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/federationListDelegationResponse'
          description: GET operation response
      summary: Retrieve the delegation.
      tags:
      - delegation
    post:
      description: |-
        Use this method to create a __Delegation__ object.
        The __Delegation__ explicitly marks authority for an address range assigned to another IPAM service.
      operationId: delegationCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/federationDelegation'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/federationCreateDelegationResponse'
          description: POST operation response
        "400":
          content:
            application/json:
              schema:
                type: object
          description: "Invalid request parameters (e.g., missing required fields,\
            \ missing required prerequisites, invalid address format, invalid CIDR\
            \ values)"
        "401":
          content:
            application/json:
              schema:
                type: object
          description: "Unauthorized access (e.g., invalid or missing authentication\
            \ token)"
        "403":
          content:
            application/json:
              schema:
                type: object
          description: "Forbidden operation (e.g., insufficient permissions to create\
            \ delegation in the specified realm)"
        "404":
          content:
            application/json:
              schema:
                type: object
          description: "Resource not found (e.g., specified federated realm, parent\
            \ block, or federated pool does not exist)"
        "409":
          content:
            application/json:
              schema:
                type: object
          description: "Conflict error (e.g., delegation already exists, address space\
            \ conflicts with existing allocations)"
        "500":
          content:
            application/json:
              schema:
                type: object
          description: "Internal server error (e.g., database connection issues, unexpected\
            \ system failures)"
      summary: Create the delegation.
      tags:
      - delegation
      x-tf-resource: delegation
      x-tf-datasource: delegations
      x-sdk-default-tags: true
      x-codegen-request-body-name: body
