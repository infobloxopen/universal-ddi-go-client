        Use this method to retrieve the next available __FederatedBlock__ objects.
        This returns one or more __FederatedBlock__ objects from the specified parent __FederatedBlock__ block.
      operationId: next_available_federated_blockListNextAvailableFederatedBlocks
      parameters:
      - description: An application specific resource identity of a resource
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "The CIDR of the federated block. This is required, if _address_\
