    \ groups.\nFollowing endpoints require \"user manage\" permission:\n - /v2/users\
    \ \n - /v2/groups\nFollowing endpoints require administrator role (admin, act_admin,\
    \ ib-access-control-admin or ib-ddi-admin):\n - POST /v2/compartments\n - PUT\
    \ /v2/compartments\n - PATCH /v2/compartments"
